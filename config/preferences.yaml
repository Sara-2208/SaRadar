# SaRadar user preferences
# Edit these to change search behavior, filters, and alert thresholds.

# Target job roles (case-sensitive, matched against job titles)
roles:
  - AI Engineer
  - Data Scientist
  - Machine Learning Engineer
  - Data Engineer
  - Data Analyst

# Geographic areas of interest (Malaysia)
areas:
  - Kuala Lumpur
  - Selangor
  - Putrajaya

# Maximum commute distance (used for lat/lng-based filtering)
max_distance_km: 40

# Job titles containing any of these (case-insensitive) will be skipped
skip_title_keywords: [intern, internship, trainee, head, director, principal, senior manager, leader]

# Minimum fit score (0-100) required to trigger a Telegram alert
fit_alert_threshold: 70
candidate_years_experience: 0

# LLM configuration
# Model tiers: fast (cheap/low-latency streaming), smart (deep reasoning).
# Each entry = "provider/model-id"; tried in order with automatic fallback.
# Supported providers: groq, gemini
llm:
  fast:
    - groq/openai/gpt-oss-20b
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-2.5-flash
  smart:
    - groq/openai/gpt-oss-120b
    - gemini/gemini-3.8-flash
    - gemini/gemini-2.5-flash
  timeout_seconds: 30
  max_retries: 1

  home_lat: 3.1390          # KL city centre (distance filter)
home_lng: 101.6869
keep_title_keywords: [ai, data, machine learning, ml, llm, genai, analytics, analyst, scientist, automation]

job_search:
  url: https://jsearch.p.rapidapi.com/search-v2
  host: jsearch.p.rapidapi.com
  country: my
  date_posted: week       # today, 3days, week, month
  monthly_budget: 180     # free plan = 200, keep 20 spare
  queries:
    - AI engineer in Kuala Lumpur, Malaysia
    - data scientist in Kuala Lumpur, Malaysia
    - machine learning engineer in Selangor, Malaysia
    - data engineer in Kuala Lumpur, Malaysia