# SaRadar user preferences
# Edit these to change search behavior, filters, and alert thresholds.

# Target job roles (case-sensitive, matched against job titles)
roles:
  - AI Engineer
  - Data Scientist
  - Machine Learning Engineer
  - Data Engineer
  - Data Analyst

# Geographic areas of interest (Malaysia)
areas:
  - Kuala Lumpur
  - Selangor
  - Putrajaya

# Maximum commute distance (used for lat/lng-based filtering)
max_distance_km: 40

# Job titles containing any of these (case-insensitive) will be skipped
skip_title_keywords:
  - intern
  - internship
  - trainee
  - head
  - director
  - principal

# Minimum fit score (0-100) required to trigger a Telegram alert
fit_alert_threshold: 70

# LLM configuration
# Model tiers: fast (cheap/low-latency streaming), smart (deep reasoning).
# Each entry = "provider/model-id"; tried in order with automatic fallback.
# Supported providers: groq, gemini
llm:
  fast:
    - groq/openai/gpt-oss-20b
    - gemini/gemini-3.5-flash-lite
    - gemini/gemini-2.5-flash
  smart:
    - groq/openai/gpt-oss-120b
    - gemini/gemini-3.8-flash
    - gemini/gemini-2.5-flash
  timeout_seconds: 30
  max_retries: 1